# kaiseki.este.systems: the project page at /, the signed apt repository at /apt/, page assets at /site/.
# Plain files under /srv/www (site/deploy and packages/publish put them there). Behind Cloudflare with
# authenticated origin pulls, like files.este.systems on the same server, whose snippets this reuses.
# Install as /etc/nginx/sites-available/kaiseki.este.systems once the certificate exists:
#   certbot certonly --webroot -w /var/www/acme -d kaiseki.este.systems
server {
    listen 80;
    listen [::]:80;
    server_name kaiseki.este.systems;
    access_log /var/log/nginx/kaiseki.access.log;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kaiseki.este.systems;
    ssl_certificate     /etc/letsencrypt/live/kaiseki.este.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaiseki.este.systems/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_client_certificate /usr/share/drop/cloudflare-origin-pull-ca.pem;
    ssl_verify_client optional;
    include /etc/nginx/snippets/drop-aop.conf;      # only Cloudflare may connect
    access_log /var/log/nginx/kaiseki.access.log;
    root /srv/www;
    charset utf-8;
    error_page 403 404 /site/error.html;

    # Every location sets its own headers (nginx does not merge add_header across levels).
    location = / {                                   # the project page
        root /srv/www/site;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nAllow: /\n"; }
    location /site/ {                                # the page's images, the error page
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location = /apt { return 301 /apt/; }
    location /apt/ {                                 # the repository: index never stale ...
        alias /srv/www/kaiseki/;
        index index.html;
        limit_except GET { deny all; }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location /apt/pool/ {                            # ... packages are named by version and never change
        alias /srv/www/kaiseki/pool/;
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location / { return 404; }
}
