# kaiseki on an existing nginx site: the apt repository under /kaiseki/, and the landing page's files under /site/.
# Install as /etc/nginx/snippets/files-site-kaiseki.conf and include it inside the site's "server { }" block.
# The landing page itself is the site's own "location = /" (root /srv/www/site; try_files /index.html =404).
# The index is small and must never be stale; packages are named by version and never change.
location /kaiseki/ {
    root /srv/www;
    index index.html;                            # written by packages/publish: how to use the repository, its contents
    charset utf-8;
    limit_except GET { deny all; }
    error_page 403 404 /site/error.html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location ~ ^/kaiseki/pool/.+\.deb$ {
    root /srv/www;
    limit_except GET { deny all; }
    error_page 403 404 /site/error.html;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
location = /kaiseki { return 301 /kaiseki/; }
location /site/ {
    root /srv/www;
    charset utf-8;
    limit_except GET { deny all; }
    error_page 403 404 /site/error.html;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
