# The repository's first address was https://files.este.systems/kaiseki/. Machines installed before it moved
# still have that in their apt sources; apt follows redirects, so send them to the new place.
# Installed as /etc/nginx/snippets/files-site-kaiseki.conf, included inside the files.este.systems server block.
location = /kaiseki { return 301 https://kaiseki.este.systems/apt/; }
location /kaiseki/ { rewrite ^/kaiseki/(.*)$ https://kaiseki.este.systems/apt/$1 permanent; }
location /site/ { return 301 https://kaiseki.este.systems$request_uri; }
