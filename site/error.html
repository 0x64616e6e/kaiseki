<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nothing here — kaiseki</title>
<style>
:root {
  --bg: #1a1b26; --panel: #1f2335; --line: #2a2f45; --text: #c0caf5; --muted: #8189af;
  --green: #9ece6a; --blue: #7aa2f7; --purple: #bb9af7; --orange: #ff9e64; --red: #f7768e;
  --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--bg); color: var(--text); font: 17px/1.6 var(--sans); -webkit-text-size-adjust: 100%; }
body { margin: 0; }
main { max-width: 1040px; margin: 0 auto; padding: 0 20px 80px; }
a { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--text); }
code, pre, .mono { font-family: var(--mono); }
header { padding: 88px 0 56px; border-bottom: 1px solid var(--line); }
h1 { font: 700 clamp(52px, 11vw, 104px)/1 var(--mono); letter-spacing: .04em; color: var(--green); margin: 0 0 20px; }
.tag { font-size: clamp(20px, 3.2vw, 27px); line-height: 1.35; max-width: 30ch; margin: 0 0 28px; color: var(--text); }
.pill { display: inline-block; font: 13px/1 var(--mono); color: var(--orange); border: 1px solid currentColor; padding: 7px 11px; margin: 0 0 28px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { font: 600 15px/1 var(--mono); padding: 14px 18px; border: 1px solid var(--blue); color: var(--blue); text-decoration: none; }
.btn.primary { background: var(--blue); color: var(--bg); }
.btn:hover { border-color: var(--text); color: var(--text); } .btn.primary:hover { background: var(--text); color: var(--bg); }
section { padding: 64px 0 0; }
h2 { font: 700 13px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--purple); margin: 0 0 22px; }
h3 { font: 600 19px/1.3 var(--sans); margin: 0 0 6px; color: var(--text); }
p { margin: 0 0 16px; max-width: 68ch; } .lead { font-size: 20px; line-height: 1.5; }
.muted { color: var(--muted); }
.numbers { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.numbers div { background: var(--bg); padding: 22px 20px; }
.numbers b { display: block; font: 700 34px/1.1 var(--mono); color: var(--green); margin-bottom: 8px; }
.numbers span { font-size: 15px; color: var(--muted); line-height: 1.4; display: block; }
figure { margin: 0; } figcaption { font-size: 14.5px; color: var(--muted); padding: 10px 2px 0; line-height: 1.45; }
figcaption b { color: var(--text); font-weight: 600; }
img { display: block; width: 100%; height: auto; border: 1px solid var(--line); background: #000; }
.wide { margin-top: 8px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 28px 22px; counter-reset: step; }
.steps figcaption::before { counter-increment: step; content: counter(step) ". "; font-family: var(--mono); color: var(--green); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px 22px; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 30px 34px; }
.how p { font-size: 16px; margin: 0; color: var(--muted); } .how p code { color: var(--text); font-size: 14px; }
pre { background: var(--panel); border: 1px solid var(--line); padding: 18px 20px; overflow-x: auto; font-size: 14px; line-height: 1.65; margin: 0 0 16px; color: var(--text); }
pre .c { color: var(--muted); }
ul.plain { list-style: none; padding: 0; margin: 0; max-width: 68ch; }
ul.plain li { padding: 11px 0 11px 26px; border-bottom: 1px solid var(--line); position: relative; }
ul.plain li::before { content: "–"; position: absolute; left: 4px; color: var(--muted); font-family: var(--mono); }
ul.done li::before { content: "✓"; color: var(--green); }
footer { margin-top: 80px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 14.5px; color: var(--muted); }
footer p { max-width: none; }
@media (max-width: 560px) { header { padding: 56px 0 40px; } section { padding-top: 48px; } html { font-size: 16px; } }
</style>
</head>
<body>
<main>
<header style="border-bottom: 0; padding-bottom: 0">
  <p class="pill">nothing at this address</p>
  <h1>kaiseki</h1>
  <p class="tag">There is no page here, or it is not one to browse.</p>
  <div class="actions">
    <a class="btn primary" href="/">About kaiseki</a>
    <a class="btn" href="/kaiseki/">Package repository</a>
  </div>
</header>
</main>
</body>
</html>
